# Apache: the dashboard is served from /var/www/html/bergen-vs-gijon,
# i.e. https://your-domain/bergen-vs-gijon/ on a default DocumentRoot.
# Put this in your site's <VirtualHost> or in /etc/apache2/conf-available/
# and enable with:  sudo a2enmod headers && sudo a2enconf bergen-vs-gijon
<Directory /var/www/html/bergen-vs-gijon>
    Options -Indexes
    AllowOverride None
    Require all granted

    # climate.json changes daily: make browsers revalidate it every time
    <Files "climate.json">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>
